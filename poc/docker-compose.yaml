services:
  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v3.14.0
    container_name: mlflow_server
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000

  web-server:
    image: nginx:alpine
    container_name: basic_web_server
    ports:
      - "8080:80"
    volumes:
          - ./index.html:/usr/share/nginx/html/index.html:ro
